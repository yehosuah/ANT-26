services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
  ui:
    build:
      context: .
      target: ui
    ports:
      - "8501:8501"
    environment:
      ANT26_API_URL: http://api:8000
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      - api
