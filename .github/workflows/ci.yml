name: checks
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run ant26 protocol-check
