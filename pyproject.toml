[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ant26"
version = "0.1.0"
description = "Auditable F1 telemetry representations and next-sector prediction"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scikit-learn>=1.5", "pyarrow>=18", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
ml = ["torch==2.14.1", "catboost>=1.2"]
tracking = ["mlflow>=2.18"]
app = ["streamlit>=1.40", "httpx>=0.27"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "httpx>=0.27",
    "mypy>=2.4.1",
]

[project.scripts]
ant26 = "ant26.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ant26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/ant26/domain", "src/ant26/serving"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
